; PlatformIO Project Configuration File
;
; Документация: https://docs.platformio.org/page/projectconf.html
;
; Если хотите переопределить что-то локально (например build_dir из-за
; кириллицы в пути на Windows) - не редактируйте этот файл, а создайте
; platformio_local.ini на основе platformio_local.ini.example.

[platformio]
extra_configs = platformio_local.ini

; .ino лежит в корне репозитория, поэтому src_dir указывает сюда же
src_dir = .

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; Сюда команда добавляет библиотеки проекта (аналог requirements.txt).
; Формат: автор/Имя библиотеки@^версия. Пример:
; lib_deps =
;     bodmer/TFT_eSPI@^2.5.43
lib_deps =

build_src_filter =
    +<*>
    -<.git/>
    -<.github/>
    -<.pio/>
    -<.vscode/>
    -<docs/>
    -<*.md>
    -<*.MD>
    -<*.ini>
    -<*.example>

; Основное окружение для сборки и прошивки платы по USB.
[env:esp32dev]
extends = common
upload_speed = 921600
